<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#3b82f6" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="CardScanner" />
  <meta name="description" content="Take a photo of any sports card to get an instant price estimate powered by AI" />
  <title>CardScanner</title>
  <link rel="manifest" href="/manifest.json" />
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <header>
    <span class="logo">🃏</span>
    <h1>CardScanner <span class="version" id="app-version"></span></h1>
  </header>

  <main>
    <section class="describe-section">
      <div class="describe-header">
        <span class="describe-label">Describe the card</span>
        <span class="describe-hint">e.g. "2003 Topps Chrome LeBron James Rookie #111"</span>
      </div>
      <textarea id="card-description" class="describe-input" placeholder="Year, brand, player, card number, any special attributes…" rows="3"></textarea>
      <button id="describe-btn" class="btn btn-primary" style="width:100%">
        🔍 Look Up by Description
      </button>
    </section>

    <div class="section-divider">or scan a photo</div>

    <section class="camera-section">
      <div class="scan-steps">
        <div class="scan-step" id="step-front">
          <div class="step-dot active"></div>
          <span>Front</span>
        </div>
        <div class="scan-step-line"></div>
        <div class="scan-step" id="step-back">
          <div class="step-dot"></div>
          <span>Back</span>
        </div>
      </div>

      <div id="scan-instruction" class="scan-instruction">Scan the <strong>front</strong> of the card</div>

      <div class="preview-area">
        <video id="video" playsinline autoplay muted></video>
        <canvas id="canvas"></canvas>

        <div class="side-previews">
          <div class="side-preview" id="front-preview-box">
            <img id="front-preview-img" alt="Front of card" style="display:none" />
            <div class="side-preview-label">Front</div>
          </div>
          <div class="side-preview" id="back-preview-box">
            <img id="back-preview-img" alt="Back of card" style="display:none" />
            <div class="side-preview-label">Back</div>
          </div>
        </div>

        <div id="placeholder" class="placeholder">
          <span class="icon">📸</span>
          <p>Open your camera to scan both sides of the card</p>
        </div>

        <div id="scan-overlay" class="scan-overlay">
          <div class="scan-frame"></div>
        </div>

        <div id="analyzing-overlay" class="analyzing-overlay">
          <div class="spinner"></div>
          <span class="analyzing-text">Analyzing card...</span>
        </div>
      </div>

      <div class="camera-controls">
        <button id="start-camera-btn" class="btn btn-primary">
          📷 Open Camera
        </button>

        <button id="capture-btn" class="btn btn-capture" style="display:none" aria-label="Capture photo">
          ⬤
        </button>

        <button id="retake-btn" class="btn btn-secondary" style="display:none">
          ↩ Retake
        </button>
      </div>

      <div style="padding: 0 1rem 1rem;">
        <button id="analyze-btn" class="btn btn-primary" style="width:100%" disabled>
          ✨ Analyze Card
        </button>
      </div>
    </section>

    <section id="results-section" class="results-section">
      <div class="card-result">
        <div id="card-image-section" class="card-image-section" style="display:none">
          <img id="card-result-img" class="card-result-img" alt="Card image" />
        </div>

        <div class="result-header">
          <div class="card-name">
            <div id="card-player" class="card-player"></div>
            <div id="card-meta" class="card-meta"></div>
          </div>
          <span id="confidence-badge" class="confidence-badge"></span>
        </div>

        <div id="attributes-section" class="attributes-section" style="display:none">
          <div id="attributes-list"></div>
        </div>

        <div class="price-table-section">
          <table class="price-table">
            <thead>
              <tr>
                <th>Grade</th>
                <th>Low</th>
                <th>High</th>
              </tr>
            </thead>
            <tbody id="price-table-body"></tbody>
          </table>
          <div id="pricing-notes" class="pricing-notes"></div>
        </div>
      </div>

      <button id="scan-again-btn" class="btn btn-secondary scan-again-btn">
        🔄 Scan Another Card
      </button>
    </section>

    <div id="error-card" class="error-card">
      <div class="error-icon">⚠️</div>
      <p id="error-msg"></p>
    </div>
  </main>

  <script src="/app.js"></script>
</body>
</html>
